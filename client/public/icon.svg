    <stop offset="0%" stop-color="#1e1e3a"/>
    <stop offset="100%" stop-color="#0f0f1a"/>
  </radialGradient>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>
  <!-- Chess knight path (simplified, clean) -->
